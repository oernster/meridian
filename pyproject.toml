[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
dynamic = ["version"]
description = "MMSP feed reader and subscription manager"
license = { text = "Apache-2.0 AND LGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "python-dateutil>=2.9",
]

[project.scripts]
meridian = "meridian.main:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["meridian*"]

[tool.setuptools.package-data]
meridian = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=meridian --cov=installer.ops --cov=installer.ui._operation_dispatch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
# `installer.ops` joined the gate on 2026-08-09. It is the part of the
# installer that writes the uninstall key, creates shortcuts and deletes files
# from a user's machine, and it was measured by nothing. `installer.ui` stays
# out because it is Qt, with the single exception of the operation dispatch,
# which touches no Qt type and is fully covered.
source = ["meridian", "installer/ops", "installer/ui/_operation_dispatch.py"]
omit = ["meridian/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.black]
line-length = 88
target-version = ["py311"]
