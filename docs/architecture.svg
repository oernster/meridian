<svg viewBox="0 0 920 396" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Meridian clean architecture</title>
<desc>The same four layer invariant as Clear Budget: UI, Application, Domain, Infrastructure, with arrows pointing inward to the pure Domain. A composition root and a background poll scheduler sit underneath. Boundaries are enforced by AST tests, 100 percent branch coverage, a 400 line file limit and a no magic numbers rule.</desc>
<defs>
<marker id="md-ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#6c7086"/></marker>
<style>
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h1{font-size:20px;font-weight:700;fill:#cdd6f4}
.cap{font-size:12px;fill:#9399b2}
.h2{font-size:13px;font-weight:500;fill:#89b4fa;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.box{fill:#313244;stroke:#45475a;stroke-width:1.5}
.core{fill:#1f2a3d;stroke:#89b4fa;stroke-width:2}
.ttl{font-size:15px;font-weight:600;fill:#cdd6f4}
.sub{font-size:11.5px;fill:#a6adc8}
.acc{font-size:11px;font-weight:600;fill:#89b4fa}
.lbl{font-size:10px;font-weight:600;fill:#7f849c;letter-spacing:.06em}
.band{fill:#181825;stroke:#313244;stroke-width:1}
.bandtx{font-size:11.5px;font-weight:500;fill:#a6adc8}
.foot{fill:#1f2a3d;stroke:#89b4fa;stroke-opacity:.45;stroke-width:1}
.foottx{font-size:11.5px;font-weight:600;fill:#89b4fa}
.arrow{stroke:#6c7086;stroke-width:2;fill:none}
</style>
</defs>
<rect x="2" y="2" width="916" height="392" rx="14" fill="#1e1e2e" stroke="#2a2a3c"/>
<text class="h1" x="45" y="40">Meridian</text>
<text class="cap" x="150" y="40">Feed reader on MMSP · Python · Qt Quick</text>
<text class="h2" x="45" y="62">UI  →  Application  →  Domain  ←  Infrastructure</text>
<rect class="box" x="45" y="92" width="170" height="116" rx="10"/>
<text class="ttl" x="130" y="118" text-anchor="middle">UI · Qt Quick</text>
<text class="sub" x="130" y="146" text-anchor="middle">AppController bridge</text>
<text class="sub" x="130" y="166" text-anchor="middle">QML reader + drawers</text>
<text class="sub" x="130" y="186" text-anchor="middle">full keyboard nav</text>
<rect class="box" x="265" y="92" width="170" height="116" rx="10"/>
<text class="ttl" x="350" y="118" text-anchor="middle">Application</text>
<text class="sub" x="350" y="146" text-anchor="middle">Subscription · Item</text>
<text class="sub" x="350" y="166" text-anchor="middle">PollOrchestrator</text>
<text class="sub" x="350" y="186" text-anchor="middle">DTOs + interfaces</text>
<rect class="core" x="485" y="92" width="170" height="116" rx="10"/>
<text class="ttl" x="570" y="118" text-anchor="middle">Domain</text>
<text class="acc" x="570" y="140" text-anchor="middle">pure · no I/O</text>
<text class="sub" x="570" y="163" text-anchor="middle">Feed · Item</text>
<text class="sub" x="570" y="183" text-anchor="middle">FilterEvaluator</text>
<rect class="box" x="705" y="92" width="170" height="116" rx="10"/>
<text class="ttl" x="790" y="118" text-anchor="middle">Infrastructure</text>
<text class="sub" x="790" y="146" text-anchor="middle">SQLAlchemy repos</text>
<text class="sub" x="790" y="166" text-anchor="middle">HttpFetcher (httpx)</text>
<text class="sub" x="790" y="186" text-anchor="middle">RSS / Atom / MMSP</text>
<text class="lbl" x="240" y="144" text-anchor="middle">DTOs</text>
<line class="arrow" x1="220" y1="150" x2="258" y2="150" marker-end="url(#md-ah)"/>
<text class="lbl" x="460" y="144" text-anchor="middle">CALLS</text>
<line class="arrow" x1="440" y1="150" x2="478" y2="150" marker-end="url(#md-ah)"/>
<text class="lbl" x="680" y="144" text-anchor="middle">IMPLEMENTS</text>
<line class="arrow" x1="700" y1="150" x2="662" y2="150" marker-end="url(#md-ah)"/>
<rect class="band" x="45" y="224" width="830" height="32" rx="8"/>
<text class="bandtx" x="460" y="244" text-anchor="middle">Composition root · main.py wires repositories, services, controller and scheduler</text>
<rect class="band" x="45" y="264" width="830" height="32" rx="8"/>
<text class="bandtx" x="460" y="284" text-anchor="middle">Background · PollScheduler (asyncio · 10s tick · 300s poll floor · conditional GET)</text>
<rect class="foot" x="45" y="312" width="830" height="36" rx="8"/>
<text class="foottx" x="460" y="334" text-anchor="middle">Enforced every test run:   AST boundary tests   ·   100% branch coverage   ·   &#8804;400 LOC / file   ·   no magic numbers</text>
<text class="cap" x="460" y="372" text-anchor="middle">Same invariant, same discipline as Clear Budget. The QML UI never touches Domain entities or Infrastructure directly.</text>
</svg>
